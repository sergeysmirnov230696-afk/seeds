<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>ZENTRA Rewards</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

/* =========================
   RESET
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;

  background: #f4f6f8;
  color: #17191d;
}

body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}


/* =========================
   APP
========================= */

.app {

  width: 100%;
  max-width: 700px;

  margin: auto;

  padding:
    0
    18px
    110px;

}


/* =========================
   PROFILE
========================= */

.profile {

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    28px
    4px
    24px;

}

.profile-left {

  display: flex;

  align-items: center;

  gap: 14px;

}

.avatar {

  width: 64px;
  height: 64px;

  border-radius: 50%;

  object-fit: cover;

  background: #e9edf3;

}

.profile-name {

  font-size: 27px;

  font-weight: 750;

  line-height: 1.1;

}

.profile-username {

  margin-top: 6px;

  font-size: 18px;

  color: #858b95;

}

.security {

  width: 54px;
  height: 54px;

  border-radius: 50%;

  border: none;

  background: #f0f3f8;

  font-size: 24px;

}


/* =========================
   BALANCE
========================= */

.balance-card {

  padding: 26px;

  border-radius: 36px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #2f91dc,
      #376dcc
    );

  box-shadow:
    0 8px 25px
    rgba(45,110,205,.18);

}

.balance-label {

  font-size: 18px;

  opacity: .8;

}

.balance-value {

  margin-top: 16px;

  font-size: 47px;

  font-weight: 800;

  letter-spacing: -1.5px;

  white-space: nowrap;

}

.balance-value span {

  font-size: 25px;

  font-weight: 500;

  opacity: .85;

}

.balance-stats {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 12px;

  margin-top: 28px;

}

.balance-stat {

  padding: 15px 18px;

  border-radius: 32px;

  background:
    rgba(255,255,255,.16);

}

.balance-stat-title {

  font-size: 16px;

  opacity: .78;

}

.balance-stat-value {

  margin-top: 5px;

  font-size: 22px;

  font-weight: 650;

}


/* =========================
   CARDS
========================= */

.card {

  margin-top: 16px;

  padding: 28px;

  border-radius: 30px;

  background: #fff;

  box-shadow:
    0 2px 12px
    rgba(20,30,50,.06);

}

.card-header {

  display: flex;

  align-items: center;

  gap: 17px;

}

.card-icon {

  width: 58px;
  height: 58px;

  min-width: 58px;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 28px;

}

.icon-yellow {

  background: #fff5df;

}

.icon-red {

  background: #ffe5e8;

}

.icon-blue {

  background: #e4f3ff;

}

.card-info {

  flex: 1;

}

.card-title {

  font-size: 23px;

  font-weight: 750;

}

.card-description {

  margin-top: 6px;

  font-size: 18px;

  line-height: 1.35;

  color: #858a92;

}


/* =========================
   COUNTER
========================= */

.counter {

  padding:
    9px
    16px;

  border-radius: 30px;

  background: #f1f4f8;

  font-size: 17px;

  font-weight: 650;

}


/* =========================
   BUTTONS
========================= */

.action-button {

  width: 100%;

  height: 64px;

  margin-top: 22px;

  border: none;

  border-radius: 35px;

  font-size: 21px;

  font-weight: 700;

  color: white;

  cursor: pointer;

}

.blue-button {

  background: #8dbbe1;

}

.red-button {

  background: #ef101c;

  box-shadow:
    0 5px 12px
    rgba(239,16,28,.15);

}

.action-button:active {

  transform: scale(.98);

}


/* =========================
   TASK ARROW
========================= */

.task-card {

  display: flex;

  align-items: center;

  gap: 16px;

}

.task-content {

  flex: 1;

}

.task-arrow {

  font-size: 32px;

  color: #777d86;

}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav {

  position: fixed;

  left: 0;
  right: 0;

  bottom: 0;

  z-index: 100;

  height: 88px;

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    rgba(255,255,255,.97);

  border-top:
    1px solid #e5e7eb;

  display: flex;

  justify-content:
    space-around;

  align-items: center;

  box-shadow:
    0 -3px 15px
    rgba(0,0,0,.04);

}

.nav-button {

  flex: 1;

  height: 100%;

  border: none;

  background: transparent;

  color: #727780;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 5px;

  font-size: 15px;

  font-weight: 600;

}

.nav-icon {

  font-size: 29px;

  line-height: 1;

}

.nav-button.active {

  color: #3485cf;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 390px) {

  .app {

    padding-left: 14px;
    padding-right: 14px;

  }

  .profile-name {

    font-size: 23px;

  }

  .profile-username {

    font-size: 16px;

  }

  .avatar {

    width: 58px;
    height: 58px;

  }

  .balance-card {

    padding: 23px;

    border-radius: 30px;

  }

  .balance-value {

    font-size: 39px;

  }

  .balance-value span {

    font-size: 21px;

  }

  .card {

    padding: 24px;

  }

  .card-title {

    font-size: 20px;

  }

  .card-description {

    font-size: 16px;

  }

}


/* =========================
   ANIMATION
========================= */

.card,
.balance-card {

  animation:
    appear .35s ease;

}

@keyframes appear {

  from {

    opacity: 0;

    transform:
      translateY(8px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}

</style>

</head>


<body>


<!-- =========================
     MAIN APP
========================= -->

<div class="app">


  <!-- PROFILE -->

  <div class="profile">

    <div class="profile-left">

      <img
        class="avatar"
        src="https://i.pravatar.cc/150?img=12"
        alt="David"
      >

      <div>

        <div class="profile-name">
          David
        </div>

        <div class="profile-username">
          @David_Wilson
        </div>

      </div>

    </div>


    <button
      class="security"
      onclick="securityInfo()"
    >
      🛡️
    </button>

  </div>


  <!-- BALANCE -->

  <div class="balance-card">

    <div class="balance-label">
      Баланс
    </div>

    <div class="balance-value">

      150.6200

      <span>
        TRX
      </span>

    </div>


    <div class="balance-stats">


      <div class="balance-stat">

        <div class="balance-stat-title">
          Всего заработано
        </div>

        <div class="balance-stat-value">
          165.6200
        </div>

      </div>


      <div class="balance-stat">

        <div class="balance-stat-title">
          Приглашено
        </div>

        <div class="balance-stat-value">
          1
        </div>

      </div>


    </div>

  </div>


  <!-- DAILY BONUS -->

  <div class="card">

    <div class="card-header">

      <div
        class="card-icon icon-yellow"
      >
        📅
      </div>


      <div class="card-info">

        <div class="card-title">
          Ежедневный бонус
        </div>

        <div class="card-description">
          Заходи каждый день — бонус
          за серию растёт.
        </div>

      </div>


      <div class="counter">
        🔥 1
      </div>

    </div>


    <button
      class="action-button blue-button"
      onclick="dailyBonus()"
    >
      Уже получено
    </button>

  </div>


  <!-- ADVERTISEMENT -->

  <div class="card">

    <div class="card-header">

      <div
        class="card-icon icon-red"
      >
        🎬
      </div>


      <div class="card-info">

        <div class="card-title">
          Смотреть рекламу
        </div>

        <div class="card-description">
          Получай TRX за каждый просмотр.
        </div>

      </div>


      <div class="counter">
        7/60
      </div>

    </div>


    <button
      class="action-button red-button"
      onclick="watchAd()"
    >
      Смотреть рекламу +0.0100 TRX
    </button>

  </div>


  <!-- TASKS -->

  <div
    class="card task-card"
    onclick="openTasks()"
  >

    <div
      class="card-icon icon-blue"
    >
      ☑️
    </div>


    <div class="task-content">

      <div class="card-title">
        Задания
      </div>

      <div class="card-description">
        Подписки и простые действия
      </div>

    </div>


    <div class="task-arrow">
      ›
    </div>

  </div>


  <!-- EXTRA SPACE -->

  <div style="height:20px"></div>


</div>


<!-- =========================
     BOTTOM NAVIGATION
========================= -->

<nav class="bottom-nav">


  <button
    class="nav-button active"
    onclick="switchTab(this,'Главная')"
  >

    <div class="nav-icon">
      ⌂
    </div>

    <div>
      Главная
    </div>

  </button>


  <button
    class="nav-button"
    onclick="switchTab(this,'Задания')"
  >

    <div class="nav-icon">
      ☷
    </div>

    <div>
      Задания
    </div>

  </button>


  <button
    class="nav-button"
    onclick="switchTab(this,'Друзья')"
  >

    <div class="nav-icon">
      ♧
    </div>

    <div>
      Друзья
    </div>

  </button>


  <button
    class="nav-button"
    onclick="switchTab(this,'Профиль')"
  >

    <div class="nav-icon">
      ♙
    </div>

    <div>
      Профиль
    </div>

  </button>


</nav>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
  window.Telegram?.WebApp;


if (tg) {

  tg.ready();

  tg.expand();


  /*
    Белая нативная шапка
  */

  if (tg.setHeaderColor) {

    tg.setHeaderColor(
      "#ffffff"
    );

  }


  /*
    Цвет фона
  */

  if (tg.setBackgroundColor) {

    tg.setBackgroundColor(
      "#f4f6f8"
    );

  }


  /*
    Нижняя панель Telegram
  */

  if (tg.setBottomBarColor) {

    tg.setBottomBarColor(
      "#ffffff"
    );

  }


  /*
    Запрещаем свайп
    для закрытия приложения
  */

  if (tg.disableVerticalSwipes) {

    tg.disableVerticalSwipes();

  }


  /*
    Fullscreen
  */

  if (tg.requestFullscreen) {

    try {

      tg.requestFullscreen();

    } catch (e) {

      console.log(
        "Fullscreen unavailable"
      );

    }

  }

}


/* =========================
   DAILY BONUS
========================= */

function dailyBonus() {

  alert(
    "Ежедневный бонус уже получен!"
  );

}


/* =========================
   WATCH AD
========================= */

function watchAd() {

  alert(
    "Здесь будет запуск рекламы."
  );

}


/* =========================
   TASKS
========================= */

function openTasks() {

  alert(
    "Открываем задания."
  );

}


/* =========================
   SECURITY
========================= */

function securityInfo() {

  alert(
    "Безопасность аккаунта."
  );

}


/* =========================
   NAVIGATION
========================= */

function switchTab(
  button,
  name
) {

  const buttons =
    document.querySelectorAll(
      ".nav-button"
    );


  buttons.forEach(
    item => {

      item.classList.remove(
        "active"
      );

    }
  );


  button.classList.add(
    "active"
  );


  console.log(
    "Открыта вкладка:",
    name
  );

}

</script>


</body>

</html>
